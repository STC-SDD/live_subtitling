<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Signup — Sous-titreur</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #111;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 24px
        }

        .card {
            width: min(420px, 92vw);
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            padding: 22px
        }

        h2 {
            margin: 0 0 14px
        }

        input,
        button {
            width: 100%;
            padding: 12px 12px;
            border-radius: 10px;
            border: 1px solid #2a2a2a;
            background: #151515;
            color: #fff
        }

        button {
            cursor: pointer;
            border: none;
            background: #2ecc71;
            color: #000;
            font-weight: 700;
            margin-top: 10px
        }

        button:hover {
            filter: brightness(.95)
        }

        .row {
            display: grid;
            gap: 10px
        }

        .err {
            color: #ff7b7b;
            min-height: 20px;
            margin-top: 10px
        }

        .ok {
            color: #77ff9a;
            min-height: 20px;
            margin-top: 10px
        }

        a {
            color: #9aa3ff;
            text-decoration: none
        }

        .muted {
            color: #888;
            font-size: .9em;
            margin-top: 10px
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Créer un compte</h2>
        <div class="row">
            <input id="name" type="text" placeholder="Nom affiché" autocomplete="name" />
            <input id="email" type="email" placeholder="Email" autocomplete="email" />
            <input id="password" type="password" placeholder="Mot de passe (min 6)" autocomplete="new-password" />
            <button id="btn">Créer</button>
            <div class="err" id="err"></div>
            <div class="ok" id="ok"></div>
            <div class="muted">Déjà un compte ? <a href="/login.html">Se connecter</a></div>
            <div class="muted"><a href="/subtitler-entry.html">Retour</a></div>
        </div>
    </div>

    <script>
        const err = document.getElementById('err');
        const ok = document.getElementById('ok');

        async function signup() {
            err.textContent = '';
            ok.textContent = '';

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Signup failed');

                ok.textContent = 'Compte créé. Redirection vers login...';
                setTimeout(() => location.replace('/login.html'), 700);
            } catch (e) {
                err.textContent = e.message;
            }
        }

        document.getElementById('btn').addEventListener('click', signup);
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') signup();
        });
    </script>
</body>

</html>
