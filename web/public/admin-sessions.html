<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gestion des Sessions</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #111; color: #fff; min-height: 100vh; padding: 24px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { font-size: 1.3em; margin-bottom: 24px; font-weight: 500; color: #888; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; font-size: 0.9em; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: #2ecc71; color: #000; }
        .btn-danger { background: #e74c3c; color: #fff; }
        .btn:hover { filter: brightness(0.9); }
        .card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
        .session-item {
            background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px;
            padding: 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
        }
        .session-item.active { border-color: #2ecc71; background: rgba(46, 204, 113, 0.05); }
        .session-info h3 { font-size: 1em; font-weight: 500; margin-bottom: 4px; }
        .session-id { background: #2a2a2a; padding: 2px 8px; border-radius: 3px; font-family: monospace; margin-right: 8px; }
        .session-status { padding: 2px 8px; border-radius: 3px; font-size: 0.75em; font-weight: 600; text-transform: uppercase; }
        .session-status.pending { background: #f39c12; color: #000; }
        .session-status.active { background: #2ecc71; color: #000; }
        .session-actions { display: flex; gap: 8px; }
        
        /* Modal simple */
        .modal {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85); z-index: 1000; align-items: center; justify-content: center;
        }
        .modal.show { display: flex; }
        .modal-content { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 30px; width: 450px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #aaa; font-size: 0.9em; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px; background: #222; border: 1px solid #444; border-radius: 6px; color: #fff;
        }
        .links a { color: #2ecc71; text-decoration: none; font-size: 0.9em; }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Gestion des Sessions</h1>
            <button class="btn btn-primary" id="createBtn">Créer une Session</button>
        </div>

        <div class="card">
            <div id="sessionsList">
                <p style="color:#444;text-align:center;">Chargement des sessions...</p>
            </div>
        </div>

        <div class="links">
            <a href="/admin.html">← Accéder au panneau Admin</a>
        </div>
    </div>

    <div class="modal" id="sessionModal">
        <div class="modal-content">
            <h2 style="margin-bottom: 20px;">Nouvelle Session</h2>

            <div class="form-group">
                <label>ID / Code de la session (ex: LIVE-MOROCCO)</label>
                <input type="text" id="sessionId" placeholder="Saisir le code..." style="text-transform: uppercase;" />
            </div>

            <div class="form-group">
                <label>Nom de l'événement</label>
                <input type="text" id="sessionTitle" placeholder="Ex: Live Speed Maroc" />
            </div>

            <div class="form-group">
                <label>Choisir la vidéo</label>
                <select id="sessionVideo">
                    <option value="">Chargement des vidéos...</option>
                </select>
            </div>

            <div id="modalMessage"></div>

            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                <button class="btn" id="modalCancel" style="background:#333; color:#ccc;">Annuler</button>
                <button class="btn btn-primary" id="modalSave">Enregistrer la Session</button>
            </div>
        </div>
    </div>

    <script src="/js/shared.js"></script>
    <script>
        const el = {
            sessionsList: document.getElementById('sessionsList'),
            createBtn: document.getElementById('createBtn'),
            modal: document.getElementById('sessionModal'),
            modalCancel: document.getElementById('modalCancel'),
            modalSave: document.getElementById('modalSave'),
            modalMessage: document.getElementById('modalMessage'),
            sessionId: document.getElementById('sessionId'),
            sessionTitle: document.getElementById('sessionTitle'),
            sessionVideo: document.getElementById('sessionVideo'),
        };

        const ADMIN_TOKEN = localStorage.getItem('stc_admin_token');
        if (!ADMIN_TOKEN) location.replace('/admin-login.html');

        function adminApi(url, options = {}) {
            return STC.apiRequest(url, {
                ...options,
                headers: { ...(options.headers || {}), Authorization: `Bearer ${ADMIN_TOKEN}` },
            });
        }

        async function loadVideos() {
            try {
                const videos = await STC.apiRequest(STC.API.VIDEOS);
                el.sessionVideo.innerHTML = '<option value="">Sélectionner une vidéo</option>';
                videos.forEach(v => {
                    const opt = document.createElement('option');
                    opt.value = v.path;
                    opt.textContent = v.name;
                    el.sessionVideo.appendChild(opt);
                });
            } catch (e) { console.error(e); }
        }

        async function loadSessions() {
            try {
                const data = await adminApi('/api/sessions');
                const sessions = data.sessions || [];
                if (sessions.length === 0) {
                    el.sessionsList.innerHTML = '<p style="color:#444;text-align:center;">Aucune session créée.</p>';
                    return;
                }

                el.sessionsList.innerHTML = sessions.map(s => `
                    <div class="session-item ${s.status === 'active' ? 'active' : ''}">
                        <div class="session-info">
                            <h3><span class="session-id">${s.id}</span> <span class="session-status ${s.status}">${s.status}</span></h3>
                            <div style="color: #eee;">${s.title}</div>
                        </div>
                        <div class="session-actions">
                            ${s.status === 'pending' ? `
                                <button class="btn btn-primary" onclick="startSession('${s.id}')">Configurer & Lancer</button>
                                <button class="btn btn-danger" onclick="deleteSession('${s.id}')">Supprimer</button>
                            ` : `
                                <button class="btn" onclick="location.href='/admin.html?session=${s.id}'" style="background:#2ecc71;">Gérer le Direct</button>
                            `}
                        </div>
                    </div>
                `).join('');
            } catch (e) { console.error(e); }
        }

        async function createSession() {
            const id = el.sessionId.value.trim().toUpperCase();
            const title = el.sessionTitle.value.trim();
            const videoPath = el.sessionVideo.value;

            if (!id || !title || !videoPath) {
                el.modalMessage.innerHTML = '<p style="color:#e74c3c; font-size:0.8em;">Remplissez tous les champs.</p>';
                return;
            }

            try {
                await adminApi('/api/sessions', {
                    method: 'POST',
                    body: JSON.stringify({ id, title, videoPath, config: {} }) // Config vide, gérée par l'admin plus tard
                });
                el.modal.classList.remove('show');
                loadSessions();
            } catch (e) { el.modalMessage.innerHTML = `<p style="color:#e74c3c;">${e.message}</p>`; }
        }

        window.startSession = (id) => location.href = `/admin.html?session=${id}`;

        window.deleteSession = async (id) => {
            if (confirm(`Supprimer la session ${id} ?`)) {
                await adminApi(`/api/sessions/${id}`, { method: 'DELETE' });
                loadSessions();
            }
        };

        el.createBtn.addEventListener('click', () => { el.modal.classList.add('show'); el.modalMessage.innerHTML=''; });
        el.modalCancel.addEventListener('click', () => el.modal.classList.remove('show'));
        el.modalSave.addEventListener('click', createSession);

        loadVideos();
        loadSessions();
        setInterval(loadSessions, 5000);
    </script>
</body>
</html>
