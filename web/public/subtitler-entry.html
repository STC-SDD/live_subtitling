<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sous-titreur — Accès</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:24px}
    .card{width:min(520px,92vw);background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;padding:22px}
    h2{margin:0 0 8px;font-weight:600}
    p{margin:0 0 18px;color:#888;font-size:.95em}
    .grid{display:grid;gap:12px}
    a{display:block;text-decoration:none;color:inherit;padding:14px 16px;border-radius:10px;border:1px solid #2a2a2a;background:#151515}
    a:hover{border-color:#3a3a3a;background:#1f1f1f}
    a.primary{background:#2ecc71;color:#000;border:none;font-weight:600}
    a.primary:hover{filter:brightness(.95)}
  </style>
</head>
<body>
  <div class="card">
    <h2>Accès Sous-titreur</h2>
    <p>Connecte-toi ou crée un compte pour participer au sous-titrage.</p>

    <div class="grid">
  <a class="primary" id="loginLink" href="/login.html">Se connecter</a>
  <a id="signupLink" href="/signup.html">Créer un compte</a>
  <a id="backLink" href="/">Retour</a>
</div>

<script>
  // garde ?poolId=... quand on navigue
  const qs = window.location.search || '';
  document.getElementById('loginLink').href  = '/login.html'  + qs;
  document.getElementById('signupLink').href = '/signup.html' + qs;
  document.getElementById('backLink').href   = '/' + qs;

  // Déjà connecté ? → on saute l’étape
  if (localStorage.getItem('stc_token')) {
    location.replace('/subtitler.html' + qs);
  }
</script>

</body>
</html>
