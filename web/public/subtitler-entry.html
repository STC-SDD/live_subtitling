<!doctype html>
<!--
  ROLE — Subtitler entry page (login + session required)
-->
<html lang="fr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sous-titreur — Accès</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #111;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      max-width: 420px;
      width: 100%;
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .header h1 {
      font-size: 1.3em;
      font-weight: 500;
      color: #fff;
      margin-bottom: 8px;
    }

    .header p {
      color: #666;
      font-size: 0.85em;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 24px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 0.9em;
      font-weight: 500;
      margin-bottom: 12px;
      color: #aaa;
    }

    .card-description {
      font-size: 0.8em;
      color: #666;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .input-group {
      margin-bottom: 12px;
    }

    .input-group label {
      display: block;
      margin-bottom: 6px;
      color: #888;
      font-size: 0.8em;
    }

    .input-group input {
      width: 100%;
      padding: 12px 14px;
      background: #151515;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      color: #fff;
      font-size: 0.95em;
      transition: border-color 0.15s;
    }

    .input-group input:focus {
      outline: none;
      border-color: #3a3a3a;
    }

    .btn {
      width: 100%;
      padding: 12px 18px;
      border: none;
      border-radius: 6px;
      font-size: 0.9em;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-primary {
      background: #2ecc71;
      color: #000;
    }

    .btn-primary:hover {
      filter: brightness(0.95);
    }

    .btn-secondary {
      background: transparent;
      color: #888;
      border: 1px solid #2a2a2a;
      margin-top: 8px;
    }

    .btn-secondary:hover {
      border-color: #3a3a3a;
      color: #aaa;
    }

    .btn-logout {
      background: #e74c3c;
      color: #fff;
      margin-top: 8px;
    }

    .error {
      color: #e74c3c;
      font-size: 0.8em;
      margin-top: 8px;
      min-height: 20px;
    }

    .footer {
      text-align: center;
      margin-top: 24px;
    }

    .footer a {
      color: #666;
      text-decoration: none;
      font-size: 0.85em;
      transition: color 0.15s;
    }

    .footer a:hover {
      color: #888;
    }

    .session-info {
      background: rgba(46, 204, 113, 0.05);
      border: 1px solid rgba(46, 204, 113, 0.2);
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 16px;
      font-size: 0.85em;
    }

    .session-info strong {
      color: #2ecc71;
    }

    .user-info {
      background: rgba(52, 152, 219, 0.05);
      border: 1px solid rgba(52, 152, 219, 0.2);
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 16px;
      font-size: 0.85em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .user-info .name {
      color: #3498db;
      font-weight: 500;
    }

    .user-info .email {
      color: #666;
      font-size: 0.9em;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>Sous-titreur</h1>
      <p id="headerSubtext">Connexion requise</p>
    </div>

    <!-- Login Card (shown first) -->
    <div class="card" id="loginCard">
      <div class="card-title">Connexion</div>
      <div class="card-description">
        Connectez-vous pour accéder aux sessions de sous-titrage.
      </div>

      <div class="input-group">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" placeholder="votre@email.com" autocomplete="email" />
      </div>

      <div class="input-group">
        <label for="loginPassword">Mot de passe</label>
        <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" />
      </div>

      <button class="btn btn-primary" id="loginBtn">
        Se connecter
      </button>

      <button class="btn btn-secondary" id="showSignupBtn">
        Créer un compte
      </button>

      <div class="error" id="loginError"></div>
    </div>

    <!-- Session Access Card (shown after login) -->
    <div class="card hidden" id="sessionCard">
      <div id="userInfoDisplay"></div>

      <div class="card-title">Code de session</div>
      <div class="card-description">
        Entrez le code fourni par l'administrateur pour rejoindre la session.
      </div>

      <div class="input-group">
        <label for="sessionCode">Code de session</label>
        <input type="text" id="sessionCode" placeholder="Ex: SESSION-001" style="text-transform: uppercase;"
          autocomplete="off" />
      </div>

      <div id="sessionInfo"></div>

      <button class="btn btn-primary" id="joinSessionBtn">
        Rejoindre la session
      </button>

      <button class="btn btn-logout" id="logoutBtn">
        Se déconnecter
      </button>

      <div class="error" id="sessionError"></div>
    </div>

    <div class="footer">
      <a href="/">← Retour à l'accueil</a>
    </div>
  </div>

  <script src="/js/shared.js"></script>
  <script>
    const el = {
      headerSubtext: document.getElementById('headerSubtext'),
      loginCard: document.getElementById('loginCard'),
      sessionCard: document.getElementById('sessionCard'),
      loginEmail: document.getElementById('loginEmail'),
      loginPassword: document.getElementById('loginPassword'),
      loginBtn: document.getElementById('loginBtn'),
      showSignupBtn: document.getElementById('showSignupBtn'),
      loginError: document.getElementById('loginError'),
      userInfoDisplay: document.getElementById('userInfoDisplay'),
      sessionCode: document.getElementById('sessionCode'),
      joinSessionBtn: document.getElementById('joinSessionBtn'),
      logoutBtn: document.getElementById('logoutBtn'),
      sessionError: document.getElementById('sessionError'),
      sessionInfo: document.getElementById('sessionInfo'),
    };

    let currentUser = null;
    let currentSession = null;

    // Check if already logged in
    function checkAuth() {
      const token = localStorage.getItem('stc_token');

      if (token) {
        try {
          const payload = JSON.parse(atob(token.split('.')[1]));

          if (payload.exp && payload.exp * 1000 < Date.now()) {
            localStorage.removeItem('stc_token');
            showLoginCard();
            return;
          }

          currentUser = {
            name: payload.name,
            email: payload.email,
          };

          showSessionCard();
        } catch (e) {
          localStorage.removeItem('stc_token');
          showLoginCard();
        }
      } else {
        showLoginCard();
      }
    }

    // Show login card
    function showLoginCard() {
      el.loginCard.classList.remove('hidden');
      el.sessionCard.classList.add('hidden');
      el.headerSubtext.textContent = 'Connexion requise';
    }

    // Show session card
    function showSessionCard() {
      el.loginCard.classList.add('hidden');
      el.sessionCard.classList.remove('hidden');
      el.headerSubtext.textContent = 'Code de session';

      el.userInfoDisplay.innerHTML = `
        <div class="user-info">
          <div>
            <div class="name">${STC.escapeHtml(currentUser.name)}</div>
            <div class="email">${STC.escapeHtml(currentUser.email)}</div>
          </div>
        </div>
      `;

      el.sessionCode.focus();
    }

    // Login
    async function handleLogin() {
      el.loginError.textContent = '';

      const email = el.loginEmail.value.trim();
      const password = el.loginPassword.value;

      if (!email) {
        el.loginError.textContent = 'Email requis';
        return;
      }

      if (!password) {
        el.loginError.textContent = 'Mot de passe requis';
        return;
      }

      try {
        const data = await STC.apiRequest('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password }),
        });

        if (data.token) {
          localStorage.setItem('stc_token', data.token);
          currentUser = data.user;
          showSessionCard();
        }
      } catch (e) {
        el.loginError.textContent = e.message || 'Erreur de connexion';
      }
    }

    // Logout
    function handleLogout() {
      localStorage.removeItem('stc_token');
      localStorage.removeItem('stc_session_id');
      currentUser = null;
      currentSession = null;
      el.loginEmail.value = '';
      el.loginPassword.value = '';
      el.sessionCode.value = '';
      el.sessionInfo.innerHTML = '';
      showLoginCard();
    }

    // Check session code validity
    async function checkSession() {
      const code = el.sessionCode.value.trim().toUpperCase();
      if (!code) return;

      try {
        const data = await STC.apiRequest(`/api/sessions/${code}`);
        currentSession = data.session;

        if (currentSession.status === 'ended') {
          el.sessionInfo.innerHTML = '';
          el.sessionError.textContent = 'Cette session est terminée';
          return;
        }

        el.sessionInfo.innerHTML = `
          <div class="session-info">
            <strong>${STC.escapeHtml(currentSession.title)}</strong><br>
            <span style="color:#888;">Statut: ${currentSession.status === 'active' ? 'En cours' : 'Programmée'}</span>
          </div>
        `;
        el.sessionError.textContent = '';
      } catch (e) {
        el.sessionInfo.innerHTML = '';
        if (e.message.includes('404') || e.message.includes('not found')) {
          el.sessionError.textContent = 'Code de session invalide';
        } else {
          el.sessionError.textContent = 'Erreur de connexion';
        }
        currentSession = null;
      }
    }

    // Join session
    async function handleJoinSession() {
      el.sessionError.textContent = '';

      const code = el.sessionCode.value.trim().toUpperCase();

      if (!code) {
        el.sessionError.textContent = 'Veuillez entrer un code de session';
        return;
      }

      if (!currentSession) {
        await checkSession();
        if (!currentSession) return;
      }

      localStorage.setItem('stc_session_id', code);
      location.replace('/subtitler.html');
    }

    // Event listeners
    el.loginBtn.addEventListener('click', handleLogin);

    el.loginPassword.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleLogin();
    });

    el.showSignupBtn.addEventListener('click', () => {
      location.href = '/signup.html';
    });

    el.logoutBtn.addEventListener('click', handleLogout);

    el.joinSessionBtn.addEventListener('click', handleJoinSession);

    el.sessionCode.addEventListener('input', () => {
      const code = el.sessionCode.value.trim().toUpperCase();
      el.sessionCode.value = code;
      currentSession = null;
      el.sessionInfo.innerHTML = '';
      el.sessionError.textContent = '';
    });

    el.sessionCode.addEventListener('blur', checkSession);

    el.sessionCode.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        handleJoinSession();
      }
    });

    // Initialize
    checkAuth();
  </script>
</body>

</html>
