<!doctype html>
<!--
  ROLE — Spectator page with session support
-->
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spectateur — Live</title>
  <script src="/vendor/hls.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      color: #fff;
    }
    
    .video-container {
      position: relative;
      width: 100%;
      height: 100vh;
      background: #000;
    }
    
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    .waiting-screen {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 20px;
    }
    
    .waiting-screen.hidden {
      display: none;
    }
    
    .waiting-text {
      font-size: 1.2em;
      color: #666;
    }
    
    .caption-display {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 90%;
      width: 800px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    
    .caption-display.visible {
      opacity: 1;
    }
    
    .caption-line {
      background: rgba(0, 0, 0, 0.85);
      padding: 12px 20px;
      margin: 4px 0;
      border-radius: 4px;
      font-size: 1.4em;
      line-height: 1.5;
      text-align: center;
      color: #fff;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
    }
    
    .controls {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
      z-index: 10;
    }
    
    .controls button {
      padding: 10px 16px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      color: #fff;
      font-size: 0.9em;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .controls button:hover {
      background: rgba(0, 0, 0, 0.9);
      border-color: rgba(255, 255, 255, 0.4);
    }
    
    .status {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      font-size: 0.9em;
      z-index: 10;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #555;
    }
    
    .status.live .status-dot {
      background: #2ecc71;
      animation: pulse 1.5s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .session-info {
      position: absolute;
      top: 70px;
      left: 20px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="video-container">
    <video id="video" playsinline></video>
    
    <div class="waiting-screen" id="waitingScreen">
      <div class="waiting-text" id="waitingText">En attente du live...</div>
    </div>
    
    <div class="caption-display" id="captionDisplay"></div>
    
    <div class="status" id="status">
      <div class="status-dot"></div>
      <span id="statusText">Connexion...</span>
    </div>

    <div class="session-info" id="sessionInfo"></div>
    
    <div class="controls">
      <button id="muteBtn">Son</button>
      <button id="fullscreenBtn">Plein écran</button>
    </div>
  </div>

  <script src="/js/shared.js"></script>
  <script src="/js/spectator.js"></script>
</body>
</html>
