<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sessions en Direct</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #111; color: #fff; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .container { width: 100%; max-width: 760px; }
    h1 { font-size: 1.8em; font-weight: 700; display:flex; gap:10px; align-items:center; justify-content:center; margin-bottom: 6px; }
    .subtitle { text-align:center; color:#777; margin-bottom: 18px; }
    .alert {
      display:none;
      margin: 12px auto 16px;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid rgba(231,76,60,0.35);
      background: rgba(231,76,60,0.08);
      color: #ff6b6b;
      max-width: 720px;
    }
    .card {
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
    .card-header { display:flex; align-items:center; justify-content:space-between; margin-bottom: 10px; }
    .card-title { font-size: 1em; color:#bbb; font-weight:600; }
    .muted { color:#666; font-size:0.9em; }
    .sessions { margin-top: 12px; display:flex; flex-direction:column; gap:10px; }
    .session {
      display:flex; align-items:center; justify-content:space-between;
      padding: 12px 12px;
      border-radius: 12px;
      border: 1px solid #2a2a2a;
      background:#111;
    }
    .session .left { display:flex; flex-direction:column; gap:4px; }
    .pill {
      display:inline-flex; align-items:center; gap:8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background:#222; color:#ddd;
      padding: 2px 10px; border-radius: 999px;
      width: fit-content;
      border: 1px solid #333;
    }
    .session .title { color:#eee; font-weight:600; }
    .btn {
      border: none; border-radius: 10px;
      padding: 10px 14px;
      cursor:pointer;
      font-weight:700;
      transition: 0.15s;
    }
    .btn:hover { filter: brightness(0.95); }
    .btn-primary { background: #2ecc71; color:#000; }
    .btn-secondary { background:#262626; color:#ddd; border: 1px solid #333; }
    .empty {
      padding: 26px 10px;
      text-align:center;
      color:#666;
    }
    .footer { text-align:center; margin-top: 14px; }
    a { color:#777; text-decoration:none; }
    a:hover { color:#aaa; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📺 Sessions en Direct</h1>
    <div class="subtitle">Cliquez sur une session pour regarder le live</div>

    <div class="alert" id="alert"></div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">Sessions disponibles</div>
        <button class="btn btn-secondary" id="refreshBtn">Actualiser</button>
      </div>

      <div class="sessions" id="sessions"></div>

      <div class="footer" style="margin-top:16px;">
        <a href="/">← Retour à l'accueil</a>
      </div>
    </div>
  </div>

  <script src="/js/shared.js"></script>
  <script>
    const el = {
      sessions: document.getElementById('sessions'),
      alert: document.getElementById('alert'),
      refreshBtn: document.getElementById('refreshBtn'),
    };

    function normalizeSessionId(id) {
      return String(id || '').trim().toUpperCase();
    }

    function showError(message) {
      el.alert.style.display = 'block';
      el.alert.textContent = message;
    }

    function clearError() {
      el.alert.style.display = 'none';
      el.alert.textContent = '';
    }

    function goToSession(sessionId) {
      const sid = normalizeSessionId(sessionId);
      if (!sid) return;
      localStorage.setItem('spectator_session_id', sid);
      location.href = '/spectator.html';
    }

    async function loadSessions() {
      clearError();
      el.sessions.innerHTML = '<div class="empty">Chargement...</div>';

      try {
        const data = await STC.apiRequest('/api/sessions/public');
        const sessions = data.sessions || [];

        if (sessions.length === 0) {
          el.sessions.innerHTML = '<div class="empty">Aucune session en direct pour le moment.</div>';
          return;
        }

        el.sessions.innerHTML = sessions.map(s => `
          <div class="session">
            <div class="left">
              <div class="pill">${STC.escapeHtml(s.id)}</div>
              <div class="title">${STC.escapeHtml(s.title || 'Session')}</div>
            </div>
            <button class="btn btn-primary" onclick="window.__join('${s.id}')">Regarder</button>
          </div>
        `).join('');
      } catch (e) {
        console.error(e);
        showError('Impossible de charger les sessions. Vérifiez votre connexion.');
        const msg = (e && e.message) ? String(e.message) : '';
        el.sessions.innerHTML =
          '<div class="empty">Impossible de charger les sessions<br><span class="muted">' +
          STC.escapeHtml(msg) +
          '</span></div>';
      }
    }

    window.__join = (id) => goToSession(id);

    el.refreshBtn.addEventListener('click', loadSessions);

    loadSessions();
    setInterval(loadSessions, 5000);
  </script>
</body>
</html>
